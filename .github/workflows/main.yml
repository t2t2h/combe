name: Build dylib
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TheosDylib
          path: build/TheosDylib.dylib
